name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ncode
          POSTGRES_PASSWORD: ncode_local_dev
          POSTGRES_DB: ncode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ncode -d ncode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ncode:ncode_local_dev@localhost:5432/ncode?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Vue assets
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
